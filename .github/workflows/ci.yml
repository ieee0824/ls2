name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked

  integration:
    runs-on: ubuntu-latest
    needs: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-go@v6
        with:
          go-version-file: integration/go.mod
          cache-dependency-path: integration/go.sum
      - run: cargo build --locked
      - name: Start ls2
        env:
          LS2_DATABASE_PATH: ${{ runner.temp }}/ls2.sqlite
        run: |
          target/debug/ls2 >"${RUNNER_TEMP}/ls2.log" 2>&1 &
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:9326/_ls2/health >/dev/null && exit 0
            sleep 1
          done
          cat "${RUNNER_TEMP}/ls2.log"
          exit 1
      - name: AWS SDK for Go v2 (path-style and virtual-hosted style)
        working-directory: integration
        run: go test -v ./...
      - name: AWS CLI v2
        run: |
          aws --version
          bash integration/aws-cli.sh
      - name: Show server log
        if: always()
        run: cat "${RUNNER_TEMP}/ls2.log"

  docker:
    runs-on: ubuntu-latest
    needs: rust
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t ls2:ci .
      - name: Smoke test
        run: |
          docker run -d --name ls2 -p 127.0.0.1:9326:9326 ls2:ci
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:9326/_ls2/health && exit 0
            sleep 1
          done
          docker logs ls2
          exit 1
