name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked

  integration:
    runs-on: ubuntu-latest
    needs: rust
    env:
      # lqs commit the notification tests run against.
      LQS_REV: ebbe2ad5bdf58fc24849e8486559b50e5590c1d8
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-go@v6
        with:
          go-version-file: integration/go.mod
          cache-dependency-path: integration/go.sum
      - run: cargo build --locked
      - name: Cache lqs
        id: lqs-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/lqs
          key: lqs-${{ runner.os }}-${{ env.LQS_REV }}
      - name: Build lqs
        if: steps.lqs-cache.outputs.cache-hit != 'true'
        run: cargo install --locked --git https://github.com/ieee0824/lqs --rev "$LQS_REV" --root "${RUNNER_TEMP}/lqs" lqs
      - name: Start lqs and ls2
        env:
          LQS_DATABASE_PATH: ${{ runner.temp }}/lqs.sqlite
          LS2_DATABASE_PATH: ${{ runner.temp }}/ls2.sqlite
          LS2_SQS_ENDPOINT: http://127.0.0.1:9324
        run: |
          "${RUNNER_TEMP}/lqs/bin/lqs" >"${RUNNER_TEMP}/lqs.log" 2>&1 &
          target/debug/ls2 >"${RUNNER_TEMP}/ls2.log" 2>&1 &
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:9324/health >/dev/null &&
              curl --fail --silent http://127.0.0.1:9326/_ls2/health >/dev/null && exit 0
            sleep 1
          done
          cat "${RUNNER_TEMP}/lqs.log" "${RUNNER_TEMP}/ls2.log"
          exit 1
      - name: AWS SDK for Go v2 (path-style, virtual-hosted style, notifications to lqs)
        working-directory: integration
        env:
          LQS_ENDPOINT: http://127.0.0.1:9324
        run: go test -v ./...
      - name: AWS CLI v2
        run: |
          aws --version
          bash integration/aws-cli.sh
      - name: Show server logs
        if: always()
        run: cat "${RUNNER_TEMP}/ls2.log" "${RUNNER_TEMP}/lqs.log"

  docker:
    runs-on: ubuntu-latest
    needs: rust
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t ls2:ci .
      - name: Smoke test
        run: |
          docker run -d --name ls2 -p 127.0.0.1:9326:9326 ls2:ci
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:9326/_ls2/health && exit 0
            sleep 1
          done
          docker logs ls2
          exit 1
